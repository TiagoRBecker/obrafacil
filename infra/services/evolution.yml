# services/evolution.yml
services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: ${CLIENT_SLUG}-evolution
    restart: always
    ports:
      - "${PORT}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - internal
    environment:
      SERVER_URL: ${SERVER_URL}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${API_KEY}
      WEBHOOK_URL: http://host.docker.internal:3003/webhook/message
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_REDIS_PREFIX_KEY: ${CLIENT_SLUG}
      CACHE_REDIS_TTL: "604800"
      CACHE_LOCAL_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evo:evo123@postgres_evo:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: "evolution_api"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1023204200"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR
      LOG_COLOR: "false"
      DEL_INSTANCE: "false"
    depends_on:
      redis:
        condition: service_healthy
      postgres_evo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s