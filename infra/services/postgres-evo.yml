# services/postgres-evo.yml
services:
  postgres_evo:
    image: postgres:16-alpine
    container_name: postgres-evo
    restart: always
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo123
      POSTGRES_DB: evolution
    volumes:
      - D:/builds/postgres/evolution:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5