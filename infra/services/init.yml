# services/init.yml
services:
  init:
    image: node:20-alpine
    container_name: ${CLIENT_SLUG}-init
    restart: "no"
    networks:
      - internal
    environment:
      API_URL: http://evolution:8080
      API_KEY: ${API_KEY}
      INSTANCE_NAME: ${INSTANCE_NAME}
      WEBHOOK_URL: "${WEBHOOK_URL}"
    volumes:
      - ./scripts/init-instances.js:/init.js:ro
    entrypoint: node /init.js
    depends_on:
      evolution:
        condition: service_healthy