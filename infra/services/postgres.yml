# services/postgres.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CLIENT_SLUG}-postgres
    restart: always
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: order
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 5s
      timeout: 5s
      retries: 5